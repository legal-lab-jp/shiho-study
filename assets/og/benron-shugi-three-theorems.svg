<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">弁論主義を、三つのテーゼで整理する</title>
  <desc id="desc">民事訴訟法の司法試験・予備試験向け学習教材</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102b49"/>
      <stop offset="1" stop-color="#1d557b"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8fc3dc" stop-opacity=".45"/>
      <stop offset="1" stop-color="#8fc3dc" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1080" cy="80" r="330" fill="url(#glow)"/>
  <rect x="68" y="58" width="202" height="44" rx="22" fill="#eef7fa"/>
  <text x="169" y="88" text-anchor="middle" fill="#173a62" font-size="22" font-weight="700" font-family="'Yu Gothic', Meiryo, sans-serif">民事訴訟法</text>
  <text x="68" y="165" fill="#c7dce8" font-size="25" font-weight="700" letter-spacing="4" font-family="'Yu Gothic', Meiryo, sans-serif">司法試験・予備試験 学習ログ</text>
  <text x="65" y="275" fill="#fff" font-size="74" font-weight="700" font-family="'Yu Mincho', serif">弁論主義を、</text>
  <text x="65" y="375" fill="#fff1bf" font-size="82" font-weight="700" font-family="'Yu Mincho', serif">三つのテーゼで</text>
  <text x="65" y="475" fill="#fff" font-size="82" font-weight="700" font-family="'Yu Mincho', serif">整理する</text>
  <text x="68" y="555" fill="#dbe8ef" font-size="25" font-family="'Yu Gothic', Meiryo, sans-serif">主張 → 証拠 → 事実認定</text>
  <g transform="translate(1000 330)" font-family="'Yu Gothic', Meiryo, sans-serif" text-anchor="middle">
    <circle cy="-112" r="56" fill="#fff" opacity=".97"/>
    <circle cy="18" r="56" fill="#fff" opacity=".97"/>
    <circle cy="148" r="56" fill="#fff" opacity=".97"/>
    <text y="-100" fill="#173a62" font-size="38" font-weight="700">1</text>
    <text y="30" fill="#173a62" font-size="38" font-weight="700">2</text>
    <text y="160" fill="#173a62" font-size="38" font-weight="700">3</text>
    <path d="M0-52V-40M0 78V90" stroke="#f0b24c" stroke-width="8" stroke-linecap="round"/>
  </g>
</svg>
